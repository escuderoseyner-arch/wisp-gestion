spring.application.name=wisp-gestion

# Base de datos. En local funciona como siempre (localhost, usuario wisp_app y DB_PASSWORD);
# en producción todo viene de DB_URL, DB_USERNAME y DB_PASSWORD (ver application-prod.properties).
# DB_USER se mantiene por compatibilidad con la configuración local anterior.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/wisp_db?serverTimezone=America/Lima}
spring.datasource.username=${DB_USERNAME:${DB_USER:wisp_app}}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Render indica el puerto en la variable PORT; en local se usa 8081
server.port=${PORT:8081}

# JWT: el secreto es Base64 de al menos 32 bytes y SOLO viene de la variable de entorno
app.jwt.secret=${JWT_SECRET}
app.jwt.expiracion-minutos=${JWT_EXPIRACION_MINUTOS:60}

# Admin inicial: solo se usa si no existe ningún ADMIN en la base de datos
app.admin-inicial.username=${ADMIN_USERNAME:}
app.admin-inicial.password=${ADMIN_PASSWORD:}
