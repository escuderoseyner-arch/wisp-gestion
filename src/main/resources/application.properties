spring.application.name=wisp-gestion
spring.datasource.url=jdbc:mysql://localhost:3306/wisp_db?serverTimezone=America/Lima
spring.datasource.username=${DB_USER:wisp_app}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
server.port=8081    

# JWT: el secreto es Base64 de al menos 32 bytes y SOLO viene de la variable de entorno
app.jwt.secret=${JWT_SECRET}
app.jwt.expiracion-minutos=${JWT_EXPIRACION_MINUTOS:60}

# Admin inicial: solo se usa si no existe ningún ADMIN en la base de datos
app.admin-inicial.username=${ADMIN_USERNAME:}
app.admin-inicial.password=${ADMIN_PASSWORD:}