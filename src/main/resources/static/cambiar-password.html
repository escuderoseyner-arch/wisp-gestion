<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Cambiar contraseña</title>
  <link rel="icon" href="data:,">
  <script src="/js/tema.js"></script>
  <link rel="stylesheet" href="/css/estilos.css">
  <script src="/js/sesion.js" defer></script>
  <script src="/js/iconos.js" defer></script>
  <script src="/js/cambiar-password.js" defer></script>
</head>
<body class="pantalla-centrada">
  <main class="tarjeta">
    <header class="marca">
      <img class="marca-logo" data-logo alt="" hidden>
      <h1 class="marca-nombre">Cambiar contraseña</h1>
      <p class="marca-sub" data-empresa>Gestión WISP</p>
    </header>

    <div id="aviso-obligatorio" class="aviso aviso-info" role="status" hidden>
      Por tu seguridad, crea una contraseña nueva antes de continuar. Usa una que puedas recordar.
    </div>
    <div id="error" class="aviso aviso-error" role="alert" hidden></div>

    <form id="form-cambiar" novalidate>
      <div class="campo">
        <label for="password-actual">Contraseña actual</label>
        <div class="campo-password">
          <input id="password-actual" name="passwordActual" type="password" maxlength="72" required
                 autocomplete="current-password">
          <button type="button" class="boton-ojo" data-mostrar="password-actual"
                  aria-label="Mostrar contraseña" aria-pressed="false">Mostrar</button>
        </div>
      </div>

      <div class="campo">
        <label for="password-nueva">Contraseña nueva</label>
        <div class="campo-password">
          <input id="password-nueva" name="passwordNueva" type="password" minlength="8" maxlength="72" required
                 autocomplete="new-password" aria-describedby="ayuda-nueva">
          <button type="button" class="boton-ojo" data-mostrar="password-nueva"
                  aria-label="Mostrar contraseña" aria-pressed="false">Mostrar</button>
        </div>
        <p id="ayuda-nueva" class="campo-ayuda">Debe tener al menos 8 caracteres. Es más segura si mezclas letras y números.</p>
      </div>

      <div class="campo">
        <label for="password-confirmar">Repite la contraseña nueva</label>
        <div class="campo-password">
          <input id="password-confirmar" name="passwordConfirmar" type="password" maxlength="72" required
                 autocomplete="new-password">
          <button type="button" class="boton-ojo" data-mostrar="password-confirmar"
                  aria-label="Mostrar contraseña" aria-pressed="false">Mostrar</button>
        </div>
      </div>

      <div class="acciones">
        <button type="submit" id="boton-guardar" class="boton boton-primario">Guardar contraseña</button>
        <a id="enlace-volver" class="boton boton-secundario" href="/" hidden><span data-icono="atras"></span>Volver</a>
        <button type="button" id="cerrar-sesion" class="boton boton-secundario"><span data-icono="salir"></span>Cerrar sesión</button>
      </div>
    </form>
  </main>
</body>
</html>
