# Perfil de producción (Render + MySQL en Aiven). Lo activa el Dockerfile con SPRING_PROFILES_ACTIVE=prod.
# Estas propiedades REEMPLAZAN a las de application.properties.

# ---------- Base de datos ----------
# Sin valores por defecto: si falta una variable, la app no arranca (mejor que conectarse mal).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# SSL obligatorio: si el servidor no ofrece una conexión cifrada, el driver se niega a conectar.
# REQUIRED cifra, pero no comprueba el certificado de Aiven; VERIFY_CA está pendiente (ver DEPLOY.md).
spring.datasource.hikari.data-source-properties.sslMode=${DB_SSL_MODE:REQUIRED}
# Pocas conexiones: el plan gratuito de Aiven limita las conexiones y la app tiene poca memoria
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# Sin imprimir cada consulta SQL en los registros
spring.jpa.show-sql=false

# ---------- Detrás del proxy de Render ----------
# "native": Tomcat lee X-Forwarded-For / X-Forwarded-Proto, pero SOLO si la conexión viene de una
# IP interna (el proxy de Render). Recorre X-Forwarded-For de derecha a izquierda saltando los
# proxies internos y se queda con la primera IP pública: la que agregó el proxy, no la que escribió
# el navegador. Así el límite de intentos por IP usa la IP real y nadie puede falsificarla.
# (No se activa en local: ahí cualquiera en 127.0.0.1 podría mandar ese encabezado.)
server.forward-headers-strategy=native

# ---------- Memoria (512 MB) ----------
# Menos hilos que el valor por defecto (200): suficiente para una empresa pequeña
server.tomcat.threads.max=40
server.tomcat.threads.min-spare=4
